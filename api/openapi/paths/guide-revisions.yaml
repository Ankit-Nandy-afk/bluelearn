# Path items for /guide-revisions. Referenced from ../openapi.yaml.
/guide-revisions/{id}:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: "../components/schemas/common/Uuid.yaml"
  get:
    tags: [guide-revisions]
    summary: Get a revision snapshot
    operationId: getGuideRevision
    responses:
      "200":
        description: The revision snapshot
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                revision:
                  $ref: "../components/schemas/guide-revisions/GuideRevision.yaml"
                subjects:
                  type: array
                  items:
                    $ref: "../components/schemas/subjects/SubjectTag.yaml"
                knowledge_type:
                  description: >
                    The guide's knowledge type, for resuming the draft. Null when
                    the base is hidden from the caller (non-author on a draft base).
                  type: [string, "null"]
                is_variant:
                  description: >
                    True when the guide sits under a base whose canonical guide
                    is a different one, so the draft resumes in the variant flow.
                  type: boolean
                base_slug:
                  description: >
                    Slug of the guide's base, used to preselect the base guide
                    when resuming a variant draft.
                  type: [string, "null"]
                  example: calculus
                variant_slug:
                  description: >
                    Slug of the guide itself, only set once it is published. Tells
                    the caller whether the draft resumes in the editor route or in
                    the contribute flow.
                  type: [string, "null"]
                  example: calculus-visual
                prerequisites:
                  description: Slugs of the guide's prerequisite guides.
                  type: array
                  items:
                    type: string
                todos:
                  description: The guide's open todo prerequisites.
                  type: array
                  items:
                    $ref: "../components/schemas/guides/TodoPrereq.yaml"
                revised_from_case_id:
                  description: >
                    Review case that rejected the revision this draft was forked
                    from, so the editor can show the panel's feedback. Null unless
                    the draft came out of a revise.
                  oneOf:
                    - $ref: "../components/schemas/common/Uuid.yaml"
                    - type: "null"
              required:
                [
                  revision,
                  subjects,
                  knowledge_type,
                  is_variant,
                  base_slug,
                  variant_slug,
                  prerequisites,
                  todos,
                  revised_from_case_id,
                ]
      "404":
        $ref: "../components/responses/_shared.yaml#/NotFound"
  patch:
    tags: [guide-revisions]
    summary: Overwrite a draft revision
    description: Pre-submit only.
    operationId: updateGuideRevision
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/guide-revisions/UpdateRevisionRequest.yaml"
    responses:
      "200":
        description: The updated revision
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                revision:
                  $ref: "../components/schemas/guide-revisions/GuideRevision.yaml"
                subjects:
                  type: array
                  items:
                    $ref: "../components/schemas/subjects/SubjectTag.yaml"
              required: [revision, subjects]
      "400":
        $ref: "../components/responses/_shared.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/_shared.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses/_shared.yaml#/NotFound"
      "422":
        $ref: "../components/responses/_shared.yaml#/Unprocessable"

/guide-revisions/{id}/submit:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: "../components/schemas/common/Uuid.yaml"
  post:
    tags: [guide-revisions]
    summary: Submit a revision for review
    description: Flips the revision to submitted and opens a review case.
    operationId: submitGuideRevision
    security:
      - bearerAuth: []
    responses:
      "201":
        description: Review case opened
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                review_case_id:
                  $ref: "../components/schemas/common/Uuid.yaml"
              required: [review_case_id]
      "401":
        $ref: "../components/responses/_shared.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses/_shared.yaml#/NotFound"
      "422":
        $ref: "../components/responses/_shared.yaml#/Unprocessable"

/guide-revisions/{id}/revise:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: "../components/schemas/common/Uuid.yaml"
  post:
    tags: [guide-revisions]
    summary: Revise a rejected submission
    description: >
      Forks the rejected revision into a fresh draft the author can edit and
      resubmit, leaving the rejected one frozen for its closed case. Returns the
      draft already opened for this rejection when there is one.
    operationId: reviseGuideRevision
    security:
      - bearerAuth: []
    responses:
      "201":
        description: The draft to edit
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                revision_id:
                  $ref: "../components/schemas/common/Uuid.yaml"
              required: [revision_id]
      "401":
        $ref: "../components/responses/_shared.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses/_shared.yaml#/NotFound"

/guide-revisions/{id}/diff/prev:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: "../components/schemas/common/Uuid.yaml"
  get:
    tags: [guide-revisions]
    summary: Diff against the previous approved revision
    description: >
      Automatically resolves the prior published revision of the same guide
      (ordered by approved_at) and returns the same { from, to, fields } diff
      as the two-id endpoint.
    operationId: diffGuideRevisionWithPrevious
    responses:
      "200":
        description: The rendered diff
        content:
          application/json:
            schema:
              $ref: "../components/schemas/guide-revisions/GuideRevisionDiff.yaml"
      "404":
        $ref: "../components/responses/_shared.yaml#/NotFound"

/guide-revisions/{id}/diff/{otherId}:
  parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: "../components/schemas/common/Uuid.yaml"
    - name: otherId
      in: path
      required: true
      schema:
        $ref: "../components/schemas/common/Uuid.yaml"
  get:
    tags: [guide-revisions]
    summary: Rendered diff between two revisions
    operationId: diffGuideRevisions
    responses:
      "200":
        description: The rendered diff
        content:
          application/json:
            schema:
              $ref: "../components/schemas/guide-revisions/GuideRevisionDiff.yaml"
      "404":
        $ref: "../components/responses/_shared.yaml#/NotFound"
