type: object
additionalProperties: false
description: A declared missing prerequisite topic (no guide base exists for it yet).
properties:
  id:
    $ref: "../common/Uuid.yaml"
  guide_base_id:
    description: The dependent guide base that declared the need.
    $ref: "../common/Uuid.yaml"
  title:
    type: string
    example: Trigonometry
  summary:
    type: string
    description: What the requester wants the missing guide to cover.
    example: Sine, cosine, and tangent on the unit circle.
  status:
    type: string
    enum: [open, resolved]
    example: open
  created_at:
    $ref: "../common/Timestamp.yaml"
required: [id, guide_base_id, title, summary, status]
