type: object
additionalProperties: false
description: >
  A todo prerequisite as shown on the public todo page: the raw row enriched with
  the dependent guide base's identity (published, so its slug exists) for links.
properties:
  id:
    $ref: "../common/Uuid.yaml"
  guide_base_id:
    description: The dependent guide base that declared the need.
    $ref: "../common/Uuid.yaml"
  guide_slug:
    type: string
    description: Slug of the dependent guide base (published, so non-null).
    example: calculus
  guide_title:
    type: [string, "null"]
    description: >
      Title of the dependent guide base, read off its canonical guide's live
      revision. Null while that base has nothing published yet, which an author
      can see for their own drafts.
    example: Calculus
  title:
    type: string
    example: Trigonometry
  summary:
    type: string
    description: What the requester wants the missing guide to cover.
    example: Sine, cosine, and tangent on the unit circle.
  status:
    type: string
    enum: [open, resolved]
    example: open
  claim_count:
    type: integer
    description: >
      How many draft guide bases have claimed this todo. Non-zero means someone
      is already writing it, which the todo page shows without blocking anyone else.
    example: 1
  created_at:
    $ref: "../common/Timestamp.yaml"
required:
  [
    id,
    guide_base_id,
    guide_slug,
    guide_title,
    title,
    summary,
    status,
    claim_count,
  ]
