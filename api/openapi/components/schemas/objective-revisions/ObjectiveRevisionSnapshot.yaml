type: object
additionalProperties: false
description: >
  A revision's editorial metadata paired with its curriculum graph. The same
  wrapper the public objective page uses ({ objective, snapshot }), keyed on the
  revision instead of the objective so the editor sees the specific revision it
  is editing.
properties:
  revision:
    $ref: "./ObjectiveRevision.yaml"
  objective:
    type: object
    additionalProperties: false
    description: >
      The revision's parent. `current_revision_id` is null until the objective
      publishes for the first time, which is how the editor tells a revision of a
      live objective from its first draft.
    properties:
      id:
        $ref: "../common/Uuid.yaml"
      current_revision_id:
        oneOf:
          - $ref: "../common/Uuid.yaml"
          - type: "null"
    required: [id, current_revision_id]
  snapshot:
    $ref: "../objectives/ObjectiveSnapshot.yaml"
  subjects:
    type: array
    items:
      $ref: "../subjects/SubjectTag.yaml"
required: [revision, objective, snapshot, subjects]
