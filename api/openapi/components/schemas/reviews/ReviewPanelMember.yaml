type: object
additionalProperties: false
description: One seat on a review panel.
properties:
  id:
    $ref: "../common/Uuid.yaml"
  member_id:
    oneOf:
      - $ref: "../common/Uuid.yaml"
      - type: "null"
  status:
    type: string
    enum: [assigned, recused, replaced, completed, pending]
    example: assigned
  assigned_at:
    oneOf:
      - $ref: "../common/Timestamp.yaml"
      - type: "null"
  expires_at:
    oneOf:
      - $ref: "../common/Timestamp.yaml"
      - type: "null"
required: [id, member_id, status]
