type: object
additionalProperties: false
description: One panel member's vote and written justification.
properties:
  id:
    $ref: "../common/Uuid.yaml"
  decision:
    type: string
    enum: [approved, rejected]
    example: approved
  notes:
    type: [string, "null"]
    example: All the information is correct.
  reasons:
    type: array
    description: Rubric reasons; present (and non-empty) only on a reject.
    items:
      $ref: "./ReviewDecisionReason.yaml"
  created_at:
    $ref: "../common/Timestamp.yaml"
  member_id:
    description: The seat that cast this vote.
    oneOf:
      - $ref: "../common/Uuid.yaml"
      - type: "null"
  member_username:
    description: >
      Username behind the seat. Panelists are named on every case they can be
      seen on, which means publicly once the case has closed.
    type: [string, "null"]
    example: euler
required: [id, decision]
