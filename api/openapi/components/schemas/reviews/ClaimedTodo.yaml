type: object
additionalProperties: false
description: >
  A todo this submission was written to fill. Approving the submission resolves
  it, so the panel sees the request before voting.
properties:
  id:
    $ref: "../common/Uuid.yaml"
  title:
    type: string
    example: Programming
  summary:
    type: string
    example: What a program is and how code becomes something that runs.
  requested_by:
    description: The published guide that asked for this topic.
    oneOf:
      - type: object
        additionalProperties: false
        properties:
          slug:
            type: string
            example: algorithms
          title:
            type: [string, "null"]
            example: Algorithms
        required: [slug, title]
      - type: "null"
required: [id, title, summary, requested_by]
