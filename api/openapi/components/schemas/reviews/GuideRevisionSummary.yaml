type: object
additionalProperties: false
description: The guide revision the case is judging.
properties:
  id:
    $ref: "../common/Uuid.yaml"
  author_id:
    description: The author who submitted the revision.
    oneOf:
      - $ref: "../common/Uuid.yaml"
      - type: "null"
  author_username:
    type: [string, "null"]
    description: Username of the author who submitted the revision.
    example: username123
  knowledge_type:
    description: >
      The knowledge type of the guide base the revision belongs to. Null when
      the base could not be resolved.
    type: [string, "null"]
    enum: [theoretical, practical, null]
    example: theoretical
  base:
    description: >
      The published guide base the revision edits, so a reviewer can open the
      guide it belongs to. Null while the base is unpublished, which is the
      case for a guide creation, and null for a viewer who cannot see the
      submission's tags and edges.
    oneOf:
      - type: object
        additionalProperties: false
        properties:
          slug:
            type: string
            example: calculus
          title:
            type: [string, "null"]
            description: Title of the base's canonical guide.
            example: Calculus
        required: [slug, title]
      - type: "null"
  title:
    type: [string, "null"]
    example: Calculus
  summary:
    type: [string, "null"]
    example: A short overview of the guide.
  body:
    type: [string, "null"]
    example: "# Calculus\n\nThe body of the guide in markdown."
  change_summary:
    type: [string, "null"]
    description: >
      The author's own note on what this revision changes. Null on a first
      submission, which has nothing to change.
    example: Rewrote the limits section and fixed two derivative examples.
  status:
    type: string
    example: submitted
  created_at:
    $ref: "../common/Timestamp.yaml"
  duration_minutes:
    type: integer
    example: 7
  tags:
    type: array
    description: >
      Subjects the revision is tagged with, identified by id because a subject
      proposed alongside the revision has no slug until it is published. Draft
      subjects are only present for a viewer who can see the submission.
    items:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "../common/Uuid.yaml"
        name:
          type: string
          example: Topology
        status:
          type: string
          enum: [draft, published]
          example: draft
      required: [id, name, status]
required: [id, status, created_at, duration_minutes, tags]
