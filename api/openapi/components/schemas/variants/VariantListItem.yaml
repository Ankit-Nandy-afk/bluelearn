type: object
additionalProperties: false
description: A variant (a method/alternative) under a guide.
properties:
  id:
    $ref: "../common/Uuid.yaml"
  slug:
    type: [string, "null"]
    example: physics-based
  title:
    type: string
    example: Physics-based approach
  summary:
    type: [string, "null"]
  is_canonical:
    description: Whether this variant is the base's canonical one.
    type: boolean
  author:
    description: Username of the variant's author, null when the account is gone.
    type: [string, "null"]
    example: username123
  updated_at:
    description: When the live revision went live, falling back to its creation.
    type: [string, "null"]
    format: date-time
  votes:
    type: object
    additionalProperties: false
    description: Public tally only; the rubric breakdown is moderator-gated.
    properties:
      up:
        type: integer
        example: 12
      down:
        type: integer
        example: 1
    required: [up, down]
required: [id, title, is_canonical, author, updated_at, votes]
